name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: [ app-with-cucumber, app-with-jbehave, app-with-concordion ]

    name: Test ${{ matrix.module }}

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run BDD tests
        run: ./mvnw -B test

      - name: Upload Concordion report
        if: matrix.module == 'app-with-concordion' && always()
        uses: actions/upload-artifact@v4
        with:
          name: concordion-report
          path: ${{ matrix.module }}/target/concordion
